# ---------------------------------------------------------------------------
# CI — Pre-merge Quality Gate (GitHub Actions)
#
# Wajib lolos sebelum merge ke main (jadikan Required status check di
# Settings > Branches). Berjalan offline-friendly: tanpa DATABASE_URL pun
# build tetap lolos via fallback local-store/dummy-data.
#
# Local equivalent:
#     npm ci && npm run lint && npx tsc --noEmit && npm run build
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch: # tombol "Run workflow" manual di tab Actions

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned)

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (pinned)
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test --if-present

      - name: Build
        run: npm run build
